name: build-book

on:
  push:
    branches: [main]
    paths:
      - "phases/**"
      - "book/**"
      - "scripts/build_book.py"
  workflow_dispatch:
    inputs:
      lang:
        description: Edition language. Use zh-TW for the Traditional Chinese volume.
        required: false
        default: en
        type: string
      volume:
        description: Volume slug. foundations is Volume 1. Leave empty to build every volume.
        required: false
        default: ""
        type: string
  release:
    types: [published]

jobs:
  book:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pandoc
        run: |
          curl -sL https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb -o /tmp/pandoc.deb
          echo "b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109  /tmp/pandoc.deb" | sha256sum -c -
          sudo dpkg -i /tmp/pandoc.deb

      - name: Install mermaid renderer
        continue-on-error: true
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Allow Chromium's user-namespace sandbox on Ubuntu
        run: |
          if command -v mmdc >/dev/null && [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install xelatex
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q texlive-xetex texlive-fonts-recommended fonts-dejavu librsvg2-bin poppler-utils

      - name: Install CJK fonts
        if: github.event.inputs.lang == 'zh-TW' || github.event.inputs.lang == 'zh' || github.event.inputs.lang == 'ja' || github.event.inputs.lang == 'ko'
        run: sudo apt-get install -y -q texlive-lang-chinese fonts-noto-cjk

      - name: Validate book rendering
        run: python3 scripts/test_book_rendering.py

      - name: Build EPUB volumes
        if: github.event_name == 'push'
        run: python3 scripts/build_book.py

      - name: Build EPUB and PDF volumes
        if: github.event_name != 'push'
        env:
          BOOK_LANG: ${{ github.event.inputs.lang || 'en' }}
          BOOK_VOLUME: ${{ github.event.inputs.volume || '' }}
        run: |
          args=(--pdf --lang "$BOOK_LANG")
          if [ -n "$BOOK_VOLUME" ]; then
            args+=(--volume "$BOOK_VOLUME")
          fi
          python3 scripts/build_book.py "${args[@]}"

      - name: Upload EPUBs
        uses: actions/upload-artifact@v4
        with:
          name: book-epub${{ github.event.inputs.lang && format('-{0}', github.event.inputs.lang) || '' }}
          path: dist/book/*.epub
          retention-days: 30

      - name: Upload PDFs
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf${{ github.event.inputs.lang && format('-{0}', github.event.inputs.lang) || '' }}
          path: dist/book/*.pdf
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/book/*.epub dist/book/*.pdf --clobber
